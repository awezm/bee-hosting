<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bee Hosting • Projects</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>Bee Hosting</h1>
      <p>Fast, reliable, and easy-to-use hosting for your projects.</p>
      <a href="#projects" class="btn">Explore Projects</a>
    </div>
  </header>

  <main id="projects" class="projects">
    <div class="container">
      <div class="list-header">
        <h2>Projects</h2>
        <input id="search" class="search" type="search" placeholder="Search projects…" aria-label="Search projects" />
      </div>
      <div id="project-grid" class="grid"></div>
    </div>
  </main>

  <section id="features" class="features">
    <div class="container grid">
      <div class="card"><h3>⚡ Fast Setup</h3><p>Deploy your apps in seconds.</p></div>
      <div class="card"><h3>🔒 Secure</h3><p>Reverse proxy & HTTPS built-in.</p></div>
      <div class="card"><h3>📈 Scalable</h3><p>Upgrade with zero downtime.</p></div>
    </div>
  </section>

  <footer><p>© 2025 Bee Hosting. All rights reserved.</p></footer>
  <script src="script.js" defer></script>
</body>
</html>
